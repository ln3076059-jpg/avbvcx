<div
  th:fragment="sidebar1"
  class="w-[72px] bg-[#1b1b1b] flex flex-col items-center py-4 gap-2 sticky top-0 h-screen z-50"
>
  <!-- Logo -->
  <a href="/moderator" class="mb-4 flex flex-col items-center gap-1">
    <i class="fa-solid fa-building-shield text-[#2eca6a] text-2xl"></i>
  </a>

  <!-- Quản lý -->
  <a
    href="/moderator"
    th:classappend="${activeSection != 'chat'} ? ' bg-white/15' : ''"
    class="w-full flex flex-col items-center gap-1 py-3 px-1 text-white hover:bg-white/10 transition"
  >
    <i class="fa-solid fa-shield-halved text-lg text-[#2eca6a]"></i>
    <span class="text-xs font-semibold leading-tight text-center"
      >Quản lý</span
    >
  </a>

  <!-- Chat -->
  <a
    href="/moderator/chat"
    th:classappend="${activeSection == 'chat'} ? ' bg-white/15' : ''"
    class="w-full flex flex-col items-center gap-1 py-3 px-1 text-white hover:bg-white/10 transition relative"
  >
    <i class="fa-solid fa-comments text-lg"></i>
    <span class="text-xs font-semibold leading-tight text-center"
      >Chat</span
    >
  </a>

  <div class="flex-1"></div>

  <!-- Logout -->
  <a
    href="/logout"
    class="w-full flex flex-col items-center gap-1 py-3 px-1 text-white/70 hover:text-white hover:bg-white/10 transition"
  >
    <i class="fa-solid fa-right-from-bracket text-lg"></i>
    <span class="text-xs font-semibold">Thoát</span>
  </a>
</div>
