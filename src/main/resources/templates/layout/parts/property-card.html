<div
  th:fragment="card(p)"
  class="upside-property-card property-item-card"
  th:data-id="${p.id}"
  th:data-slug="${p.slug}"
  th:data-price="${p.price}"
  th:data-acreage="${p.acreage}"
  th:data-title="${p.title}"
  th:data-category="${p.categoryName}"
  th:data-address="${(p.addressNumber != null ? p.addressNumber : '') + ' ' + (p.wardName != null ? p.wardName : '') + ' ' + (p.provinceName != null ? p.provinceName : '')}"
>
  <div class="blog_img">
    <a th:href="@{/public/property/{slug}(slug=${p.slug})}" class="d-block w-100 h-100">
      <img
        th:src="${p.imageUrl != null and !p.imageUrl.contains('unsplash.com') ? p.imageUrl : '/images/rooms/room-' + (((p.id % 12) + 1)) + '.jpg'}"
        th:attr="onerror=|this.onerror=null;this.src='/images/rooms/room-${((p.id % 12) + 1)}.jpg';|"
        th:alt="${p.title}"
        loading="lazy"
      />
    </a>
    <div class="position-absolute top-0 start-0 end-0 p-2 d-flex align-items-center justify-content-between" style="z-index: 3; pointer-events: none;">
      <span class="estate-badge-cat" style="pointer-events: auto;" th:text="${p.categoryName != null ? p.categoryName : 'Nhà trọ'}">Nhà trọ</span>
      <button
        type="button"
        onclick="toggleWishlist(event, this)"
        th:attr="data-slug=${p.slug},data-title=${p.title}"
        title="Lưu tin"
        class="estate-action-pill"
        style="pointer-events: auto;"
      >
        <i class="fa-regular fa-bookmark"></i>
        <span>Lưu tin</span>
      </button>
    </div>
  </div>

  <div class="image_box">
    <div class="left_box">
      <h2 class="road_text">
        <a th:href="@{/public/property/{slug}(slug=${p.slug})}" th:text="${p.title}">2186 Lohariya Road</a>
      </h2>
      <div class="area_main">
        <h3 class="area_text active">
          <a th:href="@{/public/property/{slug}(slug=${p.slug})}">
            Diện tích:<br /><span class="tabular-nums" th:text="${p.acreage + 'm²'}">25m²</span>
          </a>
        </h3>
        <h3 class="area_text">
          <a th:href="@{/public/property/{slug}(slug=${p.slug})}">
            Phòng:<br /><span class="tabular-nums" th:text="${p.numberOfRooms > 0 ? p.numberOfRooms + ' PN' : '1 PN'}">1 PN</span>
          </a>
        </h3>
        <h3 class="area_text">
          <a th:href="@{/public/property/{slug}(slug=${p.slug})}">
            Khu vực:<br /><span th:text="${p.wardName != null ? p.wardName : (p.provinceName != null ? p.provinceName : 'Trung tâm')}">Trung tâm</span>
          </a>
        </h3>
      </div>
    </div>
    <div class="right_box">
      <a th:href="@{/public/property/{slug}(slug=${p.slug})}" class="text-decoration-none">
        <div class="rate_text tabular-nums" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'">
          3.500.000 đ
        </div>
      </a>
    </div>
  </div>

  <!-- Hidden amenity tags for client filter -->
  <div class="d-none hidden">
    <span class="amenity-tag" th:each="a : ${p.amenities}" th:text="${a.name}"></span>
  </div>
</div>
