<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- ============================================================
     Hỗ Trợ Tìm Phòng — Upside Blue (#fe9901) & Gold (#f9bc19)
     API: POST /api/chat/message  { guestId, message }
     ============================================================ -->
    <div th:fragment="chat-widget" data-ui>
      <!-- Floating toggle button -->
      <button
        id="chatToggle"
        title="Hỗ trợ tìm phòng trực tuyến"
        class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full flex items-center justify-center text-white active:scale-95 transition-transform cursor-pointer border-0"
        style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); box-shadow: 0 8px 24px rgba(234, 88, 12, 0.4);"
      >
        <i id="chatToggleIcon" class="fa-solid fa-comments text-lg"></i>
        <span
          class="absolute -top-1.5 -right-1.5 bg-[#161825] text-white font-bold px-1.5 py-0.5 rounded-full leading-none"
          style="font-size: 13px;"
          >24/7</span
        >
      </button>

      <!-- Chat panel -->
      <div
        id="chatPanel"
        class="fixed bottom-24 right-6 z-50 w-80 sm:w-96 bg-white flex flex-col hidden rounded-2xl overflow-hidden"
        style="height: 520px; border: 2px solid #cbd5e1;"
      >
        <!-- Header -->
        <div
          class="text-white px-4 py-3 flex items-center justify-between flex-shrink-0"
          style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);"
        >
          <div class="flex items-center gap-2.5">
            <div
              class="w-9 h-9 rounded-full flex items-center justify-center text-white"
              style="background-color: rgba(255, 255, 255, 0.2);"
            >
              <i class="fa-solid fa-headset text-sm"></i>
            </div>
            <div>
              <p class="font-bold text-sm leading-tight m-0">
                Tư Vấn Phòng TrọMới
              </p>
              <p class="text-xs text-white/90 m-0">
                Hỗ trợ tìm phòng theo khu vực &amp; ngân sách
              </p>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button
              id="chatReset"
              type="button"
              title="Làm mới hội thoại"
              class="w-8 h-8 rounded-full hover:bg-white/20 text-white flex items-center justify-center transition-colors border-0 bg-transparent cursor-pointer"
            >
              <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
            <button
              id="chatClose"
              type="button"
              title="Đóng cửa sổ chat"
              class="w-8 h-8 rounded-full hover:bg-white/20 text-white flex items-center justify-center transition-colors border-0 bg-transparent cursor-pointer"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Message list -->
        <div
          id="chatMessages"
          class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-[#f8fafc]"
        >
          <!-- Welcome bubble (static) -->
          <div class="flex gap-2">
            <div
              class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-1 text-white"
              style="background-color: #fe9901;"
            >
              <i class="fa-solid fa-headset text-xs"></i>
            </div>
            <div
              class="bg-white rounded-2xl rounded-tl-none px-3.5 py-2.5 text-sm text-[#444444] max-w-[82%] leading-relaxed"
            >
              Xin chào! Mình là chuyên viên tư vấn tìm phòng của <strong>TrọMới</strong>.<br />
              Cho mình biết nhu cầu của bạn nhé!
            </div>
          </div>
        </div>

        <!-- Quick Prompt Chips (Gợi ý tìm nhanh) -->
        <div class="px-3 pt-2.5 pb-1.5 bg-white flex-shrink-0">
          <p class="text-xs font-semibold text-[#1b1b1b] mb-1.5 flex items-center gap-1 m-0">
            <i class="fa-solid fa-bolt" style="color: #ea580c;"></i>
            <span>Gợi ý tìm nhanh:</span>
          </p>
          <div class="flex flex-wrap gap-1.5 mt-1">
            <button
              type="button"
              onclick="sendQuickChatPrompt('Phòng dưới 3 triệu')"
              class="px-2.5 py-1 rounded-full bg-[#f1f5f9] hover:bg-[#fe9901] text-[#1b1b1b] hover:text-white text-xs font-medium transition-colors cursor-pointer border-0"
            >
              Phòng dưới 3 triệu
            </button>
            <button
              type="button"
              onclick="sendQuickChatPrompt('Phòng gần trung tâm có ban công')"
              class="px-2.5 py-1 rounded-full bg-[#f1f5f9] hover:bg-[#fe9901] text-[#1b1b1b] hover:text-white text-xs font-medium transition-colors cursor-pointer border-0"
            >
              Phòng gần trung tâm có ban công
            </button>
            <button
              type="button"
              onclick="sendQuickChatPrompt('Căn hộ mini đầy đủ nội thất')"
              class="px-2.5 py-1 rounded-full bg-[#f1f5f9] hover:bg-[#fe9901] text-[#1b1b1b] hover:text-white text-xs font-medium transition-colors cursor-pointer border-0"
            >
              Căn hộ mini đầy đủ nội thất
            </button>
          </div>
        </div>

        <!-- Input area -->
        <div class="px-3 py-3 bg-white flex-shrink-0">
          <div class="flex gap-2 items-center">
            <input
              id="chatInput"
              type="text"
              placeholder="Nhập nhu cầu tìm phòng..."
              autocomplete="off"
              class="flex-1 px-3.5 py-2 bg-[#f1f5f9] rounded-full text-sm text-[#1b1b1b] focus:outline-none border-0"
            />
            <button
              id="chatSend"
              class="w-9 h-9 rounded-full text-white flex-shrink-0 flex items-center justify-center transition-transform active:scale-90 border-0 cursor-pointer"
              style="background-color: #fe9901;"
            >
              <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
          </div>
        </div>
      </div>

      <script>
        (function () {
          "use strict";

          const INIT_QUICK_REPLIES = [
            "Căn hộ",
            "Ký túc xá / KTX",
            "Nhà trọ / Phòng trọ",
            "Nhà nguyên căn",
            "Phòng dưới 3.5tr có điều hòa",
            "Căn hộ mini đầy đủ nội thất",
          ];
          const CHAT_LOG_KEY = "chatMsgLog";

          const toggle = document.getElementById("chatToggle");
          const toggleIcon = document.getElementById("chatToggleIcon");
          const panel = document.getElementById("chatPanel");
          const closeBtn = document.getElementById("chatClose");
          const resetBtn = document.getElementById("chatReset");
          const messages = document.getElementById("chatMessages");
          const input = document.getElementById("chatInput");
          const sendBtn = document.getElementById("chatSend");

          let isOpen = false;
          let isRestoring = false;
          let msgLog = [];
          let autoFollowupTimer = null;
          let userTypedSinceResults = false;

          function saveLog() {
            try {
              sessionStorage.setItem(CHAT_LOG_KEY, JSON.stringify(msgLog));
            } catch (e) {}
          }

          function restoreLog() {
            try {
              const saved = JSON.parse(
                sessionStorage.getItem(CHAT_LOG_KEY) || "[]",
              );
              if (!Array.isArray(saved) || saved.length === 0) return;
              isRestoring = true;
              saved.forEach(function (entry) {
                if (entry.type === "user") appendUser(entry.text);
                else if (entry.type === "bot") appendBot(entry.text);
                else if (entry.type === "cards")
                  appendCards(entry.results, entry.highlightSlug || null);
              });
              isRestoring = false;
            } catch (e) {
              isRestoring = false;
            }
          }

          function getGuestId() {
            let id = localStorage.getItem("chatGuestId");
            if (!id) {
              id =
                "g_" +
                Date.now() +
                "_" +
                Math.random().toString(36).slice(2, 9);
              localStorage.setItem("chatGuestId", id);
            }
            return id;
          }

          function saveChatParams(data) {
            if (!data) return;
            localStorage.setItem(
              "chatParams",
              JSON.stringify({
                data: data,
                savedAt: Date.now(),
                ttl: 7 * 24 * 60 * 60 * 1000,
              }),
            );
          }

          toggle.addEventListener("click", () => {
            isOpen = !isOpen;
            panel.classList.toggle("hidden", !isOpen);
            toggleIcon.className = isOpen
              ? "fa-solid fa-xmark text-lg"
              : "fa-solid fa-comments text-lg";
            if (isOpen) {
              input.focus();
              scrollBottom();
            }
          });

          closeBtn.addEventListener("click", () => {
            isOpen = false;
            panel.classList.add("hidden");
            toggleIcon.className = "fa-solid fa-comments text-lg";
          });

          if (resetBtn) {
            resetBtn.addEventListener("click", () => {
              clearTimeout(autoFollowupTimer);
              sessionStorage.removeItem(CHAT_LOG_KEY);
              msgLog = [];
              while (messages.children.length > 1) {
                messages.removeChild(messages.lastChild);
              }
              appendQuickReplies(INIT_QUICK_REPLIES);
              fetch("/api/chat/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ guestId: getGuestId() }),
              }).catch(() => {});
              input.focus();
            });
          }

          input.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });
          input.addEventListener("input", function () {
            userTypedSinceResults = true;
          });
          sendBtn.addEventListener("click", sendMessage);

          function scrollBottom() {
            requestAnimationFrame(() => {
              messages.scrollTop = messages.scrollHeight;
            });
          }

          function esc(str) {
            if (str == null) return "";
            return String(str)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          }

          function removeQuickReplies() {
            document
              .querySelectorAll("#chatMessages .qr-wrap")
              .forEach((el) => el.remove());
          }

          function appendQuickReplies(replies) {
            if (!replies || replies.length === 0) return;
            const wrap = document.createElement("div");
            wrap.className = "qr-wrap flex flex-wrap gap-1.5 pl-9 pr-1";
            replies.forEach(function (label) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = label;
              btn.className =
                "qr-chip px-2.5 py-1 rounded-full text-xs border border-[#fe9901] " +
                "text-[#1b1b1b] bg-white hover:bg-[#fe9901] hover:text-white " +
                "active:scale-95 transition cursor-pointer";
              btn.addEventListener("click", function () {
                input.value = label;
                removeQuickReplies();
                sendMessage();
              });
              wrap.appendChild(btn);
            });
            messages.appendChild(wrap);
            scrollBottom();
          }

          function appendUser(text) {
            const div = document.createElement("div");
            div.className = "flex justify-end";
            div.innerHTML =
              '<div class="text-white rounded-2xl rounded-tr-none px-3.5 py-2 text-sm max-w-[82%] leading-relaxed" style="background-color: #fe9901;">' +
              esc(text) +
              "</div>";
            messages.appendChild(div);
            scrollBottom();
            if (!isRestoring) {
              msgLog.push({ type: "user", text });
              saveLog();
            }
          }

          function appendBot(text) {
            const div = document.createElement("div");
            div.className = "flex gap-2";
            div.innerHTML =
              '<div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-1 text-white" style="background-color: #fe9901;">' +
              '<i class="fa-solid fa-headset text-xs"></i></div>' +
              '<div class="bg-white rounded-2xl rounded-tl-none px-3.5 py-2 text-sm text-[#444444] max-w-[82%] leading-relaxed">' +
              esc(text) +
              "</div>";
            messages.appendChild(div);
            scrollBottom();
            if (!isRestoring) {
              msgLog.push({ type: "bot", text });
              saveLog();
            }
          }

          function appendCards(results, highlightSlug) {
            if (!results || results.length === 0) return;
            const wrap = document.createElement("div");
            wrap.className = "flex flex-col gap-2 pl-9";

            results.forEach(function (r) {
              const isHl = highlightSlug && r.postSlug === highlightSlug;
              const price =
                r.price != null
                  ? Number(r.price).toLocaleString("vi-VN") + "\u00a0đ/tháng"
                  : "Liên hệ";
              const area = r.area != null ? r.area + "\u00a0m²" : "";
              const loc =
                [r.wardName, r.provinceName].filter(Boolean).join(" · ") +
                (area ? " · " + area : "");
              const tags = (r.amenityNames || []).slice(0, 3).join(", ");

              const card = document.createElement("div");
              card.className =
                "property-card p-3 rounded-xl border text-sm transition-colors cursor-default bg-white " +
                (isHl
                  ? "border-[#fe9901] ring-2 ring-[#fe9901]"
                  : "border-gray-200 hover:border-[#fe9901]");
              card.dataset.slug = r.postSlug || "";

              card.innerHTML =
                '<div class="flex items-start gap-2">' +
                '<span class="inline-flex items-center justify-center w-5 h-5 rounded-full text-white text-xs font-bold flex-shrink-0 mt-0.5" style="background-color: #fe9901;">' +
                esc(r.displayIndex) +
                "</span>" +
                '<div class="min-w-0 flex-1">' +
                '<p class="font-semibold text-[#1b1b1b] truncate text-sm m-0">' +
                esc(r.postTitle || "") +
                "</p>" +
                '<p class="font-bold text-sm mt-0.5 m-0" style="color: #ea580c;">' +
                esc(price) +
                "</p>" +
                (loc
                  ? '<p class="text-gray-500 text-xs mt-0.5 truncate m-0">' +
                    esc(loc) +
                    "</p>"
                  : "") +
                (tags
                  ? '<p class="text-gray-500 text-xs mt-1 truncate m-0"><i class="fa-solid fa-circle-check text-[#ea580c] mr-1"></i>' +
                    esc(tags) +
                    "</p>"
                  : "") +
                "</div></div>" +
                '<a href="/public/property/' +
                esc(r.postSlug) +
                '" target="_blank" rel="noopener noreferrer"' +
                ' class="mt-2 block w-full text-center py-1.5 rounded-full text-xs font-semibold text-decoration-none transition ' +
                (isHl
                  ? "bg-[#fe9901] text-white"
                  : "bg-[#f8fafc] text-[#1b1b1b] border border-[#fe9901] hover:bg-[#fe9901] hover:text-white") +
                '">' +
                'Xem chi tiết <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs"></i>' +
                "</a>";

              wrap.appendChild(card);
            });

            messages.appendChild(wrap);
            scrollBottom();
            if (!isRestoring) {
              msgLog.push({
                type: "cards",
                results,
                highlightSlug: highlightSlug || null,
              });
              saveLog();
            }
          }

          function highlightCard(slug) {
            if (!slug) return;
            document
              .querySelectorAll("#chatMessages .property-card")
              .forEach(function (card) {
                const match = card.dataset.slug === slug;
                if (match)
                  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
              });
          }

          function showTyping() {
            const div = document.createElement("div");
            div.id = "chatTyping";
            div.className = "flex gap-2";
            div.innerHTML =
              '<div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-1 text-white" style="background-color: #fe9901;">' +
              '<i class="fa-solid fa-headset text-xs"></i></div>' +
              '<div class="bg-white rounded-2xl rounded-tl-none px-3 py-2">' +
              '<span class="flex gap-1 items-center h-4">' +
              '<span class="w-1.5 h-1.5 rounded-full bg-[#fe9901]"></span>' +
              '<span class="w-1.5 h-1.5 rounded-full bg-[#fe9901]"></span>' +
              '<span class="w-1.5 h-1.5 rounded-full bg-[#fe9901]"></span>' +
              "</span></div>";
            messages.appendChild(div);
            scrollBottom();
          }

          function removeTyping() {
            const el = document.getElementById("chatTyping");
            if (el) el.remove();
          }

          function setDisabled(disabled) {
            input.disabled = disabled;
            sendBtn.disabled = disabled;
          }

          async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            removeQuickReplies();
            appendUser(text);
            setDisabled(true);
            showTyping();

            try {
              const res = await fetch("/api/chat/message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ guestId: getGuestId(), message: text }),
              });

              if (!res.ok) throw new Error("HTTP " + res.status);
              const data = await res.json();

              removeTyping();

              if (data.resetChat) {
                while (messages.children.length > 1) {
                  messages.removeChild(messages.lastChild);
                }
                msgLog = [];
                saveLog();
                appendQuickReplies(INIT_QUICK_REPLIES);
              }

              if (data.message) appendBot(data.message);

              if (data.quickReplies && data.quickReplies.length > 0) {
                appendQuickReplies(data.quickReplies);
              }

              if (data.results && data.results.length > 0) {
                appendCards(data.results, null);
                saveChatParams({ _resultsAt: Date.now() });
                userTypedSinceResults = false;
                clearTimeout(autoFollowupTimer);
                autoFollowupTimer = setTimeout(function () {
                  if (!userTypedSinceResults) {
                    const followUp =
                      "Danh sách này có phù hợp với bạn không ạ? Bạn muốn tìm thêm tiện ích, đổi khu vực, hay tìm lại từ đầu?";
                    appendBot(followUp);
                    appendQuickReplies([
                      "Tìm thêm tiện ích",
                      "Đổi khu vực",
                      "Phù hợp rồi",
                    ]);
                  }
                }, 6000);
              }

              if (data.postSlug) {
                highlightCard(data.postSlug);
                appendBot(
                  'Đây là phòng bạn quan tâm. Bấm "Xem chi tiết" để xem thêm nhé!',
                );
              }
            } catch (err) {
              removeTyping();
              appendBot("Xin lỗi, có lỗi kết nối. Vui lòng thử lại sau.");
              console.error("[Chat]", err);
            } finally {
              setDisabled(false);
              input.focus();
            }
          }

          window.sendQuickChatPrompt = function (promptText) {
            if (!promptText) return;
            if (!isOpen) {
              isOpen = true;
              panel.classList.remove("hidden");
              toggleIcon.className = "fa-solid fa-xmark text-lg";
            }
            const targetInput = document.getElementById("chatInput") || document.getElementById("chat-input") || input;
            if (targetInput) {
              targetInput.value = promptText;
            }
            sendMessage();
          };

          (function initChat() {
            try {
              const saved = JSON.parse(
                sessionStorage.getItem(CHAT_LOG_KEY) || "[]",
              );
              if (Array.isArray(saved) && saved.length > 0) {
                msgLog = saved;
                restoreLog();
                return;
              }
            } catch (e) {}
            appendQuickReplies(INIT_QUICK_REPLIES);
          })();
        })();
      </script>
    </div>
  </body>
</html>
