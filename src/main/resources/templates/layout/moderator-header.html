<header
  th:fragment="header"
  class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-40"
>
  <!-- Left: page context -->
  <div>
    <p class="text-xs text-gray-500 uppercase tracking-wider">Kiểm duyệt</p>
    <p
      class="text-base font-bold text-gray-900"
      th:text="${session.user?.fullName ?: 'Moderator'}"
    ></p>
  </div>

  <!-- Right: actions -->
  <div class="flex items-center gap-3">
    <!-- Pending badge shortcut -->
    <a
      th:if="${pendingCount > 0}"
      href="/moderator/posts/pending"
      class="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-1.5 rounded-full text-sm font-semibold hover:bg-amber-100 transition"
    >
      <i class="fa-solid fa-clock"></i>
      <span th:text="${pendingCount} + ' chờ duyệt'"></span>
    </a>

    <!-- Re-review badge shortcut -->
    <a
      th:if="${reReviewCount > 0}"
      href="/moderator/posts/re-review"
      class="flex items-center gap-2 bg-[#e9f9f0] border border-[#2eca6a]/30 text-[#04250e] px-4 py-1.5 rounded-full text-sm font-semibold hover:bg-[#dcfae5] transition"
    >
      <i class="fa-solid fa-rotate"></i>
      <span th:text="${reReviewCount} + ' duyệt lại'"></span>
    </a>

    <div class="h-8 w-px bg-gray-200"></div>

    <!-- User avatar + logout -->
    <div class="flex items-center gap-2">
      <div
        class="w-9 h-9 bg-[#2eca6a] text-[#111814] rounded-full flex items-center justify-center font-bold text-sm"
        th:text="${session.user?.fullName?.substring(0,1)?.toUpperCase() ?: 'M'}"
      ></div>
      <a
        href="/logout"
        class="flex items-center gap-1.5 text-sm text-gray-600 hover:text-red-600 transition"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Đăng xuất</span>
      </a>
    </div>
  </div>
</header>
