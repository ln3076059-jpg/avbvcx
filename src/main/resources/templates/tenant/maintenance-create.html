<div th:fragment="content">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <div>
            <a th:href="@{/tenant/rooms}" class="btn btn-sm btn-outline-secondary mb-2">
                <i class="fas fa-arrow-left mr-1"></i> Quay lại danh sách phòng
            </a>
            <h1 class="h3 mb-1 text-gray-800 font-weight-bold">
                <i class="fas fa-tools text-warning mr-2"></i>Tạo phiếu yêu cầu sửa chữa &amp; bảo trì
            </h1>
            <p class="mb-0 text-muted small">
                Phòng áp dụng: <strong class="text-primary" th:text="${room.name}">Phòng 101</strong>
            </p>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-edit mr-1"></i> Thông tin báo hỏng thiết bị / sự cố kỹ thuật
            </h6>
        </div>
        <div class="card-body">
            <form th:action="@{|/tenant/rooms/${room.id}/maintenance/create|}" method="post" enctype="multipart/form-data"
                  th:object="${maintenanceForm}">
                <div class="form-group">
                    <label class="font-weight-bold text-gray-800">Danh mục kỹ thuật <span class="text-danger">*</span></label>
                    <select th:field="*{category}" class="form-control">
                        <option value="">-- Chọn hạng mục sự cố (Điện, Nước, Điều hòa, Nội thất...) --</option>
                        <option th:each="c : ${maintenanceCategories}" th:value="${c}" th:text="${c.displayName}"></option>
                    </select>
                    <small class="text-danger font-weight-bold" th:if="${errorCategory != null}" th:text="${errorCategory}"></small>
                </div>

                <div class="form-group">
                    <label class="font-weight-bold text-gray-800">Mô tả chi tiết tình trạng sự cố <span class="text-danger">*</span></label>
                    <textarea th:field="*{description}" rows="4" class="form-control"
                              placeholder="Mô tả rõ vị trí hỏng, biểu hiện sự cố và khung giờ bạn có mặt tại phòng để thợ kỹ thuật đến xử lý..."></textarea>
                    <small class="text-danger font-weight-bold" th:if="${errorDescription != null}" th:text="${errorDescription}"></small>
                </div>

                <div class="form-group">
                    <label class="font-weight-bold text-gray-800">Ảnh chụp hiện trạng <span class="text-muted font-weight-normal">(Tùy chọn - Tối đa 10MB)</span></label>
                    <input type="file" name="image" accept="image/*" class="form-control-file border p-2 rounded bg-light">
                </div>

                <hr>
                <div class="d-flex align-items-center">
                    <button type="submit" class="btn btn-primary font-weight-bold shadow-sm mr-2">
                        <i class="fas fa-paper-plane mr-1"></i> Gửi yêu cầu bảo trì
                    </button>
                    <a th:href="@{|/tenant/rooms/${room.id}|}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>

</div>
