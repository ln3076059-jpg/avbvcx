<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả tải lên CCCD | Trọ Mới PMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">
    <div class="max-w-lg w-full bg-white rounded-3xl border border-slate-200/80 shadow-xl p-6 sm:p-8 space-y-6">
        <div class="flex items-center gap-3.5 border-b border-slate-100 pb-4">
            <div class="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center text-xl shrink-0">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-slate-900">Kết quả xử lý hồ sơ ảnh</h1>
                <p class="text-xs text-slate-500 mt-0.5">Mã định danh tệp tin (File Hash) trên hệ thống</p>
            </div>
        </div>

        <div th:if="${errors != null and !errors.isEmpty()}" class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 space-y-1">
            <h3 class="text-xs font-extrabold uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-triangle-exclamation"></i> Có lỗi khi tải lên
            </h3>
            <ul class="list-disc list-inside text-xs space-y-0.5">
                <li th:each="err : ${errors}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="space-y-3 text-xs">
            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <span class="font-bold text-slate-500 uppercase text-xs block mb-1">Hash Mặt trước CCCD</span>
                <p class="font-mono font-semibold text-slate-800 break-all" th:text="${frontHash != null ? frontHash : 'Không có'}"></p>
            </div>

            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <span class="font-bold text-slate-500 uppercase text-xs block mb-1">Hash Mặt sau CCCD</span>
                <p class="font-mono font-semibold text-slate-800 break-all" th:text="${backHash != null ? backHash : 'Không có'}"></p>
            </div>

            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                <span class="font-bold text-slate-500 uppercase text-xs block mb-1">Hash Khuôn mặt</span>
                <p class="font-mono font-semibold text-slate-800 break-all" th:text="${faceHash != null ? faceHash : 'Không có'}"></p>
            </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-3">
            <a th:href="@{/upload}" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                Tải lại ảnh khác
            </a>
            <a th:href="@{/}" class="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-xs transition">
                Về Trang chủ
            </a>
        </div>
    </div>
</body>
</html>
