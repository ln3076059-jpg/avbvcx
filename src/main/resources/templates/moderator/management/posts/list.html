<div>
  <!-- Flash messages -->
  <div th:if="${successMessage}" class="mb-4 px-4 py-3 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-sm flex items-center gap-2">
    <i class="fa-solid fa-circle-check"></i>
    <span th:text="${successMessage}"></span>
  </div>
  <div th:if="${errorMessage}" class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm flex items-center gap-2">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span th:text="${errorMessage}"></span>
  </div>

  <!-- Page title & Search / Bulk Actions Toolbar -->
  <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900"
          th:text="${activeTab == 'pending'} ? 'Bài đăng chờ duyệt' : (${activeTab == 're-review'} ? 'Bài đăng chờ duyệt lại' : 'Bài đăng chờ chỉnh sửa')"></h1>
      <p class="text-sm text-gray-500 mt-0.5">
        <span th:text="${posts.size()}">0</span> bài đăng trong danh sách
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <div class="relative min-w-[240px]">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text"
               id="modPostSearchInput"
               oninput="filterModPostsTable(this.value)"
               placeholder="Tìm theo tiêu đề, chủ nhà, SĐT..."
               class="w-full pl-9 pr-4 py-2 rounded-xl border border-gray-200 bg-white text-xs text-gray-800 focus:outline-none focus:border-[#0054a5]" />
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(posts)}"
       class="bg-white rounded-2xl border border-gray-100 shadow-sm p-12 text-center text-gray-400">
    <i class="fa-solid fa-inbox text-4xl mb-3 block"></i>
    <p class="text-sm text-gray-500 italic"
       th:text="${activeTab == 'pending'} ? 'Không có bài nào đang chờ duyệt.' : (${activeTab == 're-review'} ? 'Không có bài nào cần duyệt lại.' : 'Không có bài nào đang chờ chỉnh sửa.')"></p>
  </div>

  <!-- Bulk Approve Form & Table -->
  <form th:if="${!#lists.isEmpty(posts)}"
        th:action="@{/moderator/posts/bulk-approve}"
        method="post"
        class="space-y-4"
        data-confirm="Bạn có chắc chắn muốn duyệt nhanh các bài đăng đã chọn?">
    <input type="hidden" name="returnTab" th:value="${activeTab}" />

    <div th:if="${activeTab == 'pending' or activeTab == 're-review'}"
         class="flex flex-wrap items-center justify-between gap-3 bg-white rounded-2xl border border-gray-100 shadow-sm px-5 py-3.5">
      <label class="flex items-center gap-2.5 text-xs font-semibold text-gray-700 cursor-pointer select-none">
        <input type="checkbox" id="selectAllModPosts" onchange="toggleAllModPosts(this)" class="w-4 h-4 accent-[#0054a5] cursor-pointer" />
        <span>Chọn tất cả bài hiển thị</span>
      </label>

      <button type="submit"
              class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-2 transition cursor-pointer">
        <i class="fa-solid fa-check-double"></i>
        <span>Duyệt nhanh các bài đã chọn</span>
      </button>
    </div>

    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
      <table class="w-full text-sm text-left" id="modPostsTable">
        <thead class="bg-gray-50 border-b border-gray-100 text-gray-500 text-xs font-bold">
          <tr>
            <th th:if="${activeTab == 'pending' or activeTab == 're-review'}" class="px-4 py-4 w-10 text-center">#</th>
            <th class="px-6 py-4">Tiêu đề</th>
            <th class="px-6 py-4">Chủ nhà</th>
            <th class="px-6 py-4">Danh mục</th>
            <th class="px-6 py-4">Ngày gửi</th>
            <th class="px-6 py-4 text-right">Thao tác</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
          <tr th:each="p : ${posts}" class="mod-post-row hover:bg-blue-50/30 transition-colors">
            <td th:if="${activeTab == 'pending' or activeTab == 're-review'}" class="px-4 py-4 text-center">
              <input type="checkbox" name="postIds" th:value="${p.id}" class="mod-post-checkbox w-4 h-4 accent-[#0054a5] cursor-pointer" />
            </td>
            <td class="px-6 py-4">
              <p class="font-semibold text-gray-900 line-clamp-1" th:text="${p.title}"></p>
              <p class="text-xs text-gray-400 mt-0.5" th:text="${p.slug}"></p>
            </td>
            <td class="px-6 py-4">
              <p class="font-medium text-gray-700"
                 th:text="${p.property?.owner?.fullName ?: p.property?.owner?.username ?: 'N/A'}"></p>
              <p class="text-xs text-gray-400"
                 th:text="${p.property?.owner?.phone ?: ''}"></p>
            </td>
            <td class="px-6 py-4 text-gray-600"
                th:text="${p.property?.category?.name ?: '—'}"></td>
            <td class="px-6 py-4 text-gray-500"
                th:text="${p.createdAt != null} ? ${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')} : '—'"></td>
            <td class="px-6 py-4 text-right">
              <a th:href="@{|/moderator/posts/${p.id}|}"
                 class="inline-flex items-center gap-1.5 text-[#0054a5] hover:underline font-medium text-sm">
                <i class="fa-solid fa-eye text-xs"></i> Xem
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </form>

  <script>
    function toggleAllModPosts(master) {
      document.querySelectorAll('.mod-post-row').forEach(function (row) {
        if (row.style.display === 'none') return;
        var cb = row.querySelector('.mod-post-checkbox');
        if (cb) cb.checked = master.checked;
      });
    }

    function filterModPostsTable(keyword) {
      var kw = (keyword || '').trim().toLowerCase();
      document.querySelectorAll('.mod-post-row').forEach(function (row) {
        var text = (row.textContent || '').toLowerCase();
        row.style.display = (!kw || text.indexOf(kw) !== -1) ? '' : 'none';
      });
    }
  </script>
</div>
