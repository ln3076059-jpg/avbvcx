<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Lỗi hệ thống | TrọMới - EstateAgency PMS</title>
    <link th:href="@{/assets/img/favicon.png}" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Raleway:wght@600;700;800&display=swap" rel="stylesheet" /> <!-- taste-skill-ignore -->
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet" />
    <link th:href="@{/assets/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" />
    <link th:href="@{/assets/css/main.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100 bg-white">
    <div th:replace="~{layout/header :: header-main}"></div>
    <main class="main flex-grow-1 d-flex align-items-center justify-content-center py-5 light-background" style="margin-top: 85px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="bg-white p-5 text-center" style="border-top: 4px solid #2eca6a !important;">
                        <div class="mx-auto mb-4 rounded-circle d-flex align-items-center justify-content-center text-dark" style="width: 72px; height: 72px; background-color: #2eca6a;">
                            <i class="fa-solid fa-triangle-exclamation fs-3"></i>
                        </div>
                        <span class="badge rounded-pill px-3 py-1 mb-2" style="background-color: #1b1b1b;">MÃ LỖI 500</span>
                        <h1 class="h3 fw-bold mb-2">Đã xảy ra sự cố xử lý</h1>
                        <p class="text-muted small mb-3">
                            Hệ thống gặp sự cố không mong muốn khi xử lý yêu cầu của bạn. Vui lòng thử lại hoặc quay về trang quản lý chính.
                        </p>
                        <div th:if="${message != null and !#strings.isEmpty(message)}"
                             class="p-2.5 bg-light small text-dark mb-4"
                             th:text="${message}">
                        </div>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button type="button" onclick="history.back()" class="btn btn-outline-dark rounded-pill px-4 py-2 small fw-semibold">
                                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại
                            </button>
                            <a th:href="@{/}" class="btn rounded-pill px-4 py-2 small fw-semibold text-dark" style="background-color: #2eca6a;">
                                <i class="fa-solid fa-house me-1"></i>Về Trang chủ
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{layout/footer :: footer-main}"></div>
    <script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
