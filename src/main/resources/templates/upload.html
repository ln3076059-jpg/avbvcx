<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải lên CCCD & Xác thực eKYC | Trọ Mới PMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">
    <div class="max-w-lg w-full bg-white rounded-3xl border border-slate-200/80 shadow-xl p-6 sm:p-8 space-y-6">
        <div class="flex items-center gap-3.5 border-b border-slate-100 pb-4">
            <div class="w-12 h-12 rounded-2xl bg-sky-50 border border-sky-100 text-sky-600 flex items-center justify-center text-xl shrink-0">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-slate-900">Tải lên CCCD & Khuôn mặt</h1>
                <p class="text-xs text-slate-500 mt-0.5">Xác thực giấy tờ tùy thân để hoàn tất hồ sơ cư dân</p>
            </div>
        </div>

        <form th:action="@{/upload}" method="post" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label for="frontImage" class="block text-xs font-bold text-slate-700 mb-1.5">
                    <i class="fa-regular fa-id-card text-sky-600 mr-1"></i>Ảnh mặt trước CCCD <span class="text-rose-500">*</span>
                </label>
                <input type="file" id="frontImage" name="frontImage" accept="image/*" required
                       class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 border border-slate-200 rounded-xl p-1.5 bg-slate-50/50"/>
            </div>

            <div>
                <label for="backImage" class="block text-xs font-bold text-slate-700 mb-1.5">
                    <i class="fa-solid fa-id-card-clip text-sky-600 mr-1"></i>Ảnh mặt sau CCCD <span class="text-rose-500">*</span>
                </label>
                <input type="file" id="backImage" name="backImage" accept="image/*" required
                       class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 border border-slate-200 rounded-xl p-1.5 bg-slate-50/50"/>
            </div>

            <div>
                <label for="faceImage" class="block text-xs font-bold text-slate-700 mb-1.5">
                    <i class="fa-solid fa-camera-retro text-sky-600 mr-1"></i>Ảnh chân dung khuôn mặt <span class="text-rose-500">*</span>
                </label>
                <input type="file" id="faceImage" name="faceImage" accept="image/*" required
                       class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 border border-slate-200 rounded-xl p-1.5 bg-slate-50/50"/>
            </div>

            <div class="pt-2 flex items-center justify-between gap-3">
                <a th:href="@{/}" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                    Hủy bỏ
                </a>
                <button type="submit"
                        class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-700 hover:to-blue-800 text-white text-xs font-bold shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Tải lên & Xác thực</span>
                </button>
            </div>
        </form>
    </div>
</body>
</html>
