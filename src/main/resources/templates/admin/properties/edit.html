<div th:fragment="content" class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800 font-weight-bold">
                Chỉnh Sửa Cơ Sở: <span class="text-primary" th:text="${property.name}">Tên cơ sở</span>
            </h1>
            <p class="text-muted small mb-0">Cập nhật thông tin phân loại, mức giá niêm yết và địa chỉ cơ sở nhà trọ.</p>
        </div>
        <a th:href="@{/admin/properties}" class="btn btn-secondary btn-icon-split shadow-sm">
            <span class="icon text-white-50">
                <i class="fas fa-arrow-left"></i>
            </span>
            <span class="text font-weight-bold">Quay Lại Danh Sách</span>
        </a>
    </div>

    <!-- Form Card -->
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow mb-4">
                <div class="card-header py-3 bg-white border-bottom-primary d-flex align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-hotel mr-1"></i> Thông Tin Cơ Sở Nhà Trọ
                    </h6>
                    <span class="badge badge-info">ID: <span th:text="${property.id}">1</span></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{'/admin/properties/' + ${property.id} + '/edit'}" method="post">
                        
                        <div class="form-group">
                            <label for="name" class="font-weight-bold text-gray-700">
                                Tên cơ sở nhà trọ <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="name" name="name" required 
                                   th:value="${property.name}" placeholder="Ví dụ: Khu trọ sinh viên Hòa Bình">
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="categoryId" class="font-weight-bold text-gray-700">
                                    Loại hình bất động sản <span class="text-danger">*</span>
                                </label>
                                <select class="form-control" id="categoryId" name="categoryId" required>
                                    <option th:each="cat : ${categories}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}" 
                                            th:selected="${property.category != null and property.category.id == cat.id}">Nhà trọ</option>
                                </select>
                            </div>

                            <div class="form-group col-md-6">
                                <label for="numberOfRooms" class="font-weight-bold text-gray-700">
                                    Số lượng phòng <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control" id="numberOfRooms" name="numberOfRooms" required min="1"
                                       th:value="${property.numberOfRooms}">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="price" class="font-weight-bold text-gray-700">
                                    Mức giá cho thuê (VNĐ/tháng) <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control" id="price" name="price" required min="0"
                                       th:value="${property.price}">
                            </div>

                            <div class="form-group col-md-6">
                                <label for="acreage" class="font-weight-bold text-gray-700">
                                    Diện tích khuôn viên (m²) <span class="text-danger">*</span>
                                </label>
                                <input type="number" step="0.1" class="form-control" id="acreage" name="acreage" required min="1"
                                       th:value="${property.acreage}">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="originalAddress" class="font-weight-bold text-gray-700">
                                Địa chỉ cụ thể
                            </label>
                            <input type="text" class="form-control" id="originalAddress" name="originalAddress" 
                                   th:value="${property.originalAddress != null ? property.originalAddress : property.addressNumber}">
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end">
                            <a th:href="@{/admin/properties}" class="btn btn-secondary mr-2">
                                <i class="fas fa-times mr-1"></i> Hủy Bỏ
                            </a>
                            <button type="submit" class="btn btn-primary font-weight-bold">
                                <i class="fas fa-save mr-1"></i> Cập Nhật Cơ Sở
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
