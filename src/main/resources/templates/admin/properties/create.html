<div th:fragment="content" class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800 font-weight-bold">Thêm Cơ Sở Nhà Trọ Mới</h1>
            <p class="text-muted small mb-0">Thiết lập hồ sơ toà nhà/khu trọ mới trên hệ thống cho chủ nhà.</p>
        </div>
        <a th:href="@{/admin/properties}" class="btn btn-secondary btn-icon-split shadow-sm">
            <span class="icon text-white-50">
                <i class="fas fa-arrow-left"></i>
            </span>
            <span class="text font-weight-bold">Quay Lại Danh Sách</span>
        </a>
    </div>

    <!-- Form Card -->
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow mb-4">
                <div class="card-header py-3 bg-white border-bottom-primary">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-hotel mr-1"></i> Thông Tin Khai Báo Cơ Sở Mới
                    </h6>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/properties/create}" method="post">
                        
                        <div class="form-group">
                            <label for="name" class="font-weight-bold text-gray-700">
                                Tên cơ sở nhà trọ / Toà nhà <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="name" name="name" required 
                                   placeholder="Ví dụ: Khu trọ sinh viên Cầu Giấy...">
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="ownerId" class="font-weight-bold text-gray-700">
                                    Chủ cơ sở (Chủ nhà trọ) <span class="text-danger">*</span>
                                </label>
                                <select class="form-control" id="ownerId" name="ownerId" required>
                                    <option value="">-- Chọn chủ nhà trọ --</option>
                                    <option th:each="o : ${owners}" 
                                            th:value="${o.id}" 
                                            th:text="${(o.fullName != null ? o.fullName : o.username) + ' (' + o.username + ')'}">Chủ trọ</option>
                                </select>
                            </div>

                            <div class="form-group col-md-6">
                                <label for="categoryId" class="font-weight-bold text-gray-700">
                                    Loại hình bất động sản <span class="text-danger">*</span>
                                </label>
                                <select class="form-control" id="categoryId" name="categoryId" required>
                                    <option value="">-- Chọn phân loại --</option>
                                    <option th:each="cat : ${categories}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}">Nhà trọ</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="price" class="font-weight-bold text-gray-700">
                                    Giá thuê trung bình (VNĐ/tháng) <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control" id="price" name="price" required min="0" 
                                       value="2500000">
                            </div>

                            <div class="form-group col-md-4">
                                <label for="numberOfRooms" class="font-weight-bold text-gray-700">
                                    Số lượng phòng <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control" id="numberOfRooms" name="numberOfRooms" required min="1" 
                                       value="10">
                            </div>

                            <div class="form-group col-md-4">
                                <label for="acreage" class="font-weight-bold text-gray-700">
                                    Diện tích khuôn viên (m²) <span class="text-danger">*</span>
                                </label>
                                <input type="number" step="0.1" class="form-control" id="acreage" name="acreage" required min="1" 
                                       value="25.0">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="originalAddress" class="font-weight-bold text-gray-700">
                                Địa chỉ đầy đủ
                            </label>
                            <input type="text" class="form-control" id="originalAddress" name="originalAddress" 
                                   placeholder="Ví dụ: Số 12, Ngõ 45, Đường Xuân Thủy, Cầu Giấy, Hà Nội">
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end">
                            <a th:href="@{/admin/properties}" class="btn btn-secondary mr-2">
                                <i class="fas fa-times mr-1"></i> Hủy Bỏ
                            </a>
                            <button type="submit" class="btn btn-primary font-weight-bold">
                                <i class="fas fa-save mr-1"></i> Tạo Cơ Sở Nhà Trọ
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
