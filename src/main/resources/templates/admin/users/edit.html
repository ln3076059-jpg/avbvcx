<div th:fragment="content" class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800 font-weight-bold">
                Chỉnh Sửa Tài Khoản: <span class="text-primary" th:text="${user.username}">username</span>
            </h1>
            <p class="text-muted small mb-0">Cập nhật thông tin định danh, thay đổi vai trò hoặc cấp lại mật khẩu cho tài khoản.</p>
        </div>
        <a th:href="@{/admin/users}" class="btn btn-secondary btn-icon-split shadow-sm">
            <span class="icon text-white-50">
                <i class="fas fa-arrow-left"></i>
            </span>
            <span class="text font-weight-bold">Quay Lại Danh Sách</span>
        </a>
    </div>

    <!-- Form Card -->
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow mb-4">
                <div class="card-header py-3 bg-white border-bottom-primary d-flex align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-user-edit mr-1"></i> Thông Tin Chi Tiết Tài Khoản
                    </h6>
                    <span class="badge" th:classappend="${user.active ? 'badge-success' : 'badge-danger'}"
                          th:text="${user.active ? 'Đang hoạt động' : 'Đang bị khóa'}">Hoạt động</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">
                        
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label class="font-weight-bold text-gray-700">Tên đăng nhập (Username)</label>
                                <input type="text" class="form-control bg-light" th:value="${user.username}" readonly>
                                <small class="form-text text-muted">Tên đăng nhập không thể thay đổi để bảo toàn lịch sử giao dịch.</small>
                            </div>

                            <div class="form-group col-md-6">
                                <label for="newPassword" class="font-weight-bold text-gray-700">
                                    Đổi mật khẩu mới
                                </label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                                    </div>
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" 
                                           placeholder="Để trống nếu không muốn đổi mật khẩu">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="fullName" class="font-weight-bold text-gray-700">Họ và tên đầy đủ</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" 
                                   th:value="${user.fullName}" placeholder="Nhập họ và tên">
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="email" class="font-weight-bold text-gray-700">Địa chỉ Email</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    </div>
                                    <input type="email" class="form-control" id="email" name="email" 
                                           th:value="${user.email}" placeholder="nguyenvana@tromoi.vn">
                                </div>
                            </div>

                            <div class="form-group col-md-6">
                                <label for="phone" class="font-weight-bold text-gray-700">Số điện thoại liên hệ</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    </div>
                                    <input type="tel" class="form-control" id="phone" name="phone" 
                                           th:value="${user.phone}" placeholder="0912345678">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="roleName" class="font-weight-bold text-gray-700">
                                Vai trò người dùng (3 vai trò) <span class="text-danger">*</span>
                            </label>
                            <select class="form-control" id="roleName" name="roleName" required>
                                <option value="USER" 
                                        th:selected="${user.roles.?[name == 'ADMIN'].size() == 0 and user.roles.?[name == 'OWNER'].size() == 0}">Khách hàng (USER)</option>
                                <option value="OWNER" 
                                        th:selected="${user.roles.?[name == 'ADMIN'].size() == 0 and user.roles.?[name == 'OWNER'].size() > 0}">Chủ nhà trọ (OWNER)</option>
                                <option value="ADMIN" 
                                        th:selected="${user.roles.?[name == 'ADMIN'].size() > 0}">Quản trị viên - Toàn quyền (ADMIN)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <div class="custom-control custom-switch mt-2">
                                <input type="checkbox" class="custom-control-input" id="active" name="active" value="true"
                                       th:checked="${user.active}">
                                <label class="custom-control-label font-weight-bold text-gray-800" for="active">
                                    Kích hoạt tài khoản (Cho phép đăng nhập và sử dụng hệ thống)
                                </label>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small text-muted">
                                Ngày tạo tài khoản: 
                                <strong th:text="${user.createAt != null ? #temporals.format(user.createAt, 'dd/MM/yyyy HH:mm') : 'N/A'}">01/01/2026</strong>
                            </span>
                            <div>
                                <a th:href="@{/admin/users}" class="btn btn-secondary mr-2">
                                    <i class="fas fa-times mr-1"></i> Hủy Bỏ
                                </a>
                                <button type="submit" class="btn btn-primary font-weight-bold">
                                    <i class="fas fa-save mr-1"></i> Cập Nhật Thông Tin
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
